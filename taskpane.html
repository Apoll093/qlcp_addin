<style>

    return msg("Bấm “⚠ Xác nhận xoá” để xoá " + t.lb + " (có thể Ctrl+Z trong Excel nếu lỡ tay)", true);
  }
  delDisarm();
  if (t.k === "ct") return delCT(t);
  const refs = await delRefs(t);
  if (refs.length) return msg("⛔ Không xoá được " + t.key + " – đang được dùng tại: " + refs.join("; ") + ". Xoá hoặc đổi các dòng liên quan trước.", true);
  let nC = 0;
  await Excel.run(async (ctx) => {
    const tb = ctx.workbook.tables.getItem(t.tn), body = tb.getDataBodyRange(); body.load("values,rowCount"); await ctx.sync();
    let k = t.ix != null && body.values[t.ix] && String(body.values[t.ix][0]) === t.key ? t.ix : body.values.findIndex((r) => String(r[0]) === t.key);
    if (k < 0) throw new Error("Không tìm thấy " + t.key + " trong bảng");
    await delRow(ctx, tb, k, body.rowCount);
    for (const c of (DEL_CASCADE[t.tn] || [])) nC += await delWhere(ctx, c[0], c[1], t.key);
    await delViews(ctx);
  });
  await build(t.tn);
  if (X()) xMode("edit"); else setMode("edit");
  msg("🗑 Đã xoá " + t.key + (nC ? " (kèm " + nC + " dòng liên quan)" : ""), false);
}
async function delRow(ctx, tb, k, n) {
  if (n > 1) { tb.rows.getItemAt(k).delete(); await ctx.sync(); return; }
  const r = tb.getDataBodyRange().getRow(0); r.load("formulas"); await ctx.sync();
  r.formulas = [r.formulas[0].map((f) => String(f).charAt(0) === "=" ? f : "")]; await ctx.sync();
}
async function delWhere(ctx, tn, col, key) {
  try {
    const tb = ctx.workbook.tables.getItem(tn), h = tb.getHeaderRowRange(), b = tb.getDataBodyRange(); h.load("values"); b.load("values,rowCount"); await ctx.sync();
    const i = h.values[0].indexOf(col); if (i < 0) return 0;
    const ks = []; b.values.forEach((r, k) => { if (String(r[i]) === String(key)) ks.push(k); });
    let n = b.rowCount; ks.sort((a, c) => c - a);
    for (const k of ks) { await delRow(ctx, tb, k, n); n--; }
    return ks.length;
  } catch (e) { return 0; }
}
async function delViews(ctx) {
  try {
    const wb = ctx.workbook, hd = wb.tables.getItem("tbl_HopDong").getDataBodyRange(), dv = wb.names.getItem("lst_DonViTC").getRange();
    const v1 = wb.tables.getItem("tbl_HDHienHanh"), v2 = wb.tables.getItem("tbl_TVHienHanh"), b1 = v1.getDataBodyRange(), b2 = v2.getDataBodyRange();
    hd.load("rowCount"); dv.load("rowCount"); b1.load("rowCount"); b2.load("rowCount"); await ctx.sync();
    const cut = (t, have, need) => { for (let k = have - 1; k >= Math.max(need, 1); k--) t.rows.getItemAt(k).delete(); };
    cut(v1, b1.rowCount, hd.rowCount); cut(v2, b2.rowCount, dv.rowCount); await ctx.sync();
  } catch (e) { }
}
async function delRefs(t) {
  if (DEL_NOREF.indexOf(t.tn) >= 0) return [];
  const out = [];
  await Excel.run(async (ctx) => {
    const ts = ctx.workbook.tables; ts.load("items/name"); await ctx.sync();
    const oh = ctx.workbook.tables.getItem(t.tn).getHeaderRowRange(); oh.load("values"); await ctx.sync();
    const al = DEL_ALIAS[t.tn] || [], names = [String(oh.values[0][0])].concat(al), cas = (DEL_CASCADE[t.tn] || []).map((c) => c[0]);
    const L = ts.items.filter((x) => DEL_SKIP.indexOf(x.name) < 0 && cas.indexOf(x.name) < 0).map((x) => { const h = x.getHeaderRowRange(), b = x.getDataBodyRange(); h.load("values"); b.load("values"); return { n: x.name, h: h, b: b }; });
    await ctx.sync();
    const hit = (v) => { const s = String(v == null ? "" : v).trim(); return s !== "" && (s === t.key || s.split(/\s*[;,]\s*/).indexOf(t.key) >= 0); };
    L.forEach((x) => {
      const self = x.n === t.tn, cols = x.h.values[0].map((c, i) => [String(c), i]).filter((c) => (self ? al : names).indexOf(c[0]) >= 0);
      if (!cols.length) return;
      let n = 0; x.b.values.forEach((r) => { if (self && String(r[0]) === t.key) return; if (cols.some((c) => hit(r[c[1]]))) n++; });
      if (n) out.push((TABLES[x.n] ? TABLES[x.n].replace(/^\S+\s/, "") : x.n.replace(/^tbl_/, "")) + " (" + n + " dòng)");
    });
  });
  return out;
}
async function delCT(t) {
  let n = 0;
  await Excel.run(async (ctx) => { n = await delWhere(ctx, CT_TN, CT.ct.H[0], t.key); });
  const d = await ctLoad(); CT.da = d.da; CT.qd = d.qd; CT.ct = d.ct; META.rows = d.ct.R;
  const q = CT.qd.R.find((r) => String(r[0]) === t.key) || null; CT.q = undefined; ctPick(q);
  msg("🗑 Đã xoá " + n + " dòng chi tiết của " + t.key, false);
}
</script>
