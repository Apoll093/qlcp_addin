<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QLCP – Form nhập liệu</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
:root{--navy:#0F2A44;--bg:#F4F6FB;--line:#E2E8F0;--txt:#1E293B;--mut:#64748B;--pri:#2563EB}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;font-size:13px;color:var(--txt);background:var(--bg);padding-bottom:74px}
.top{background:linear-gradient(90deg,#0F2A44,#1E3A5F);color:#fff;padding:8px 10px 6px;position:sticky;top:0;z-index:20}
.row1{display:flex;align-items:center;gap:8px}
.brand{font-weight:700;white-space:nowrap;font-size:13.5px;flex:1}
.avatar{width:26px;height:26px;border-radius:50%;background:#F59E0B;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex:none}
.nav{display:flex;gap:3px;overflow-x:auto;margin-top:6px;scrollbar-width:none}
.nav a{color:#CBD5E1;text-decoration:none;padding:4px 8px;border-radius:6px;white-space:nowrap;font-size:12px;cursor:pointer}
.nav a.on{background:rgba(255,255,255,.18);color:#fff;font-weight:600}
#tbl{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:3px 6px;font-size:12px;width:auto;max-width:150px}
#tbl option{color:#1E293B}
.wrap{padding:10px}
.crumb{color:var(--mut);font-size:11.5px;margin-bottom:4px}.crumb b{color:var(--txt)}
.title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.title h1{font-size:17px;margin:0}.title .sp{flex:1}
.badge{font-size:11px;padding:2px 9px;border-radius:999px;font-weight:600}
.b-new{background:#DBEAFE;color:#1D4ED8}.b-edit{background:#FEF3C7;color:#B45309}
.link{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12px;color:var(--txt)}
.modebar{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:#E2E8F0;border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--txt);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
#pick{flex:1;min-width:150px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.sum .k{font-size:11px;color:var(--mut)}.sum .v{font-weight:700;font-size:13.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{height:6px;background:#E2E8F0;border-radius:4px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:linear-gradient(90deg,#22C55E,#16A34A);width:0;transition:width .3s}
.st{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
.st-g{background:#DCFCE7;color:#166534}.st-b{background:#DBEAFE;color:#1D4ED8}.st-o{background:#FFEDD5;color:#C2410C}.st-s{background:#E2E8F0;color:#334155}.st-r{background:#FEE2E2;color:#991B1B}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;position:sticky;top:64px;background:var(--bg);z-index:10;scrollbar-width:thin}
.tab{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;white-space:nowrap;font-size:12px;transition:all .15s}
.tab .n{width:20px;height:20px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--c)}
.tab:hover{border-color:var(--c)}.tab.on{border-color:var(--c);background:var(--cl);color:var(--c);font-weight:600}
.tab.done .n{background:#16A34A}
.sec{border-left:4px solid var(--c);scroll-margin-top:150px}
.sec h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px;color:var(--c)}
.sec h2 .ic{width:28px;height:28px;border-radius:8px;background:var(--cl);display:flex;align-items:center;justify-content:center;font-size:15px}
.sec h2 small{margin-left:auto;font-weight:500;color:var(--mut);font-size:11px;background:var(--cl);padding:2px 8px;border-radius:999px}
.note{font-size:11.5px;color:var(--mut);background:var(--cl);border-radius:6px;padding:6px 8px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 10px}.full{grid-column:1/-1}
@media(max-width:360px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:3px;font-weight:600}
.req{color:#DC2626}.fx{color:#0891B2;font-style:italic;font-weight:700}
input,select,textarea{width:100%;padding:6px 8px;border:1px solid #CBD5E1;border-radius:6px;font:inherit;background:#fff;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.calc{background:#F1F5F9;color:#334155;border-style:dashed}.num{text-align:right}
.unit{position:relative}.unit span{position:absolute;right:8px;top:7px;color:var(--mut);font-size:11px}.unit input{padding-right:42px}
.hint{font-size:11px;color:var(--mut);margin-top:3px}
.err{border-color:#DC2626!important;background:#FEF2F2!important}
.hint:empty{display:none}.hint.warn{color:#B45309;font-weight:600}
input:disabled,textarea:disabled{background:#F1F5F9;color:#94A3B8;cursor:not-allowed}
.locked label{color:#94A3B8}
.lockmsg{display:none;font-size:11.5px;color:#64748B;background:#F8FAFC;border:1px dashed #CBD5E1;border-radius:6px;padding:5px 8px;margin-bottom:8px}
.cb{position:relative;min-width:0}.cb>select{display:none!important}
.cb-btn{width:100%;display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid #CBD5E1;border-radius:6px;font:inherit;background:#fff;color:var(--txt);cursor:pointer;text-align:left}
.cb-btn .cb-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cb-btn .cb-a{color:var(--mut);font-size:10px}
.cb-btn.ph .cb-t{color:#94A3B8}.cb-btn:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.cb-btn:disabled{background:#F1F5F9;color:#94A3B8;cursor:not-allowed}
.cb-pop{position:fixed;z-index:60;background:#fff;border:1px solid #CBD5E1;border-radius:8px;box-shadow:0 8px 24px rgba(15,42,68,.18);display:flex;flex-direction:column;overflow:hidden}
.cb-pop .cb-q{margin:6px;width:auto;flex:none}.cb-list{overflow-y:auto;flex:1}
.cb-item{padding:6px 10px;cursor:pointer;color:var(--txt)}.cb-item:hover,.cb-item.act{background:#EFF6FF}.cb-item.sel{font-weight:600;color:var(--pri)}
.cb-empty{padding:8px 10px;color:var(--mut);font-style:italic}
.nav .cb-btn{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);padding:3px 6px;font-size:12px}.nav .cb-btn .cb-a{color:#CBD5E1}
#tblW{flex:none;min-width:130px;max-width:170px}#pickW{flex:1;min-width:150px}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:8px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 -2px 10px rgba(15,42,68,.08);z-index:20}
.foot .info{flex:1;min-width:0}.foot .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.foot .info small{color:var(--mut)}
.btn{border:0;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;font-size:12.5px;white-space:nowrap}
.btn.pri{background:var(--pri);color:#fff}.btn.pri:hover{background:#1D4ED8}.btn.gh{background:#E2E8F0;color:var(--txt)}
#msg{position:fixed;left:10px;right:10px;bottom:66px;padding:9px 12px;border-radius:8px;display:none;font-weight:600;z-index:30;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.ok{background:#DCFCE7;color:#166534}.bad{background:#FEE2E2;color:#991B1B}
.nav2{display:flex;gap:4px;overflow-x:auto;margin-top:5px;scrollbar-width:none}
.nav2:empty{display:none}
.nav2 a{color:#E2E8F0;background:rgba(255,255,255,.08);text-decoration:none;padding:3px 10px;border-radius:999px;white-space:nowrap;font-size:11.5px;cursor:pointer}
.nav2 a.on{background:#fff;color:#0F2A44;font-weight:600}
.back{display:none;margin:0 0 6px}
.ctg{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.ctg th{background:#F1F5F9;color:var(--mut);font-weight:600;padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}
.ctg td{padding:3px 4px;border-bottom:1px solid #F1F5F9;vertical-align:top}
.ctg .tt{width:44px;color:var(--mut);font-size:11px}.ctg .gv{width:30%}.ctg .vt{width:24%}
.ctg tr.par td{background:#F8FAFC;font-weight:700}.ctg tr.lv1 td{background:#EEF2FF}
.ctg tr.tot td{background:#0F2A44;color:#fff;font-weight:700}.ctg tfoot td{border:0}
.ctg input{padding:4px 5px;font-size:12px}.ctg .cb-btn{padding:4px 5px;font-size:12px}
.ctg .amt{font-size:11px;color:var(--mut);text-align:right;margin-top:2px}
.ctg .nm{display:flex;align-items:flex-start;gap:4px}.ctg .nm .t{flex:1;min-width:0;word-break:break-word;padding-top:4px}
.ctg .del{border:0;background:none;color:#DC2626;cursor:pointer;font-size:13px;padding:3px 2px}
.ctg .ro{display:block;text-align:right;padding:4px 5px}
.addbtn{margin:6px 6px 4px 0;border:1px dashed var(--pri);background:#EFF6FF;color:var(--pri);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px;font-weight:600}
</style>
</head>
<body>
<header class="top">
  <div class="row1"><div class="brand">🏗️ Nhập liệu – Quản lý chi phí ĐTXD</div><div class="avatar" id="avatar">NL</div></div>
  <nav class="nav" id="nav"></nav>
  <nav class="nav2" id="nav2"></nav>
</header>
<div class="wrap">
  <div class="back" id="back"></div>
  <div class="crumb" id="crumb"></div>
  <div class="title">
    <h1 id="h1"></h1><span class="badge b-new" id="badge">Thêm mới</span>
    <span class="sp"></span><button class="link" id="goto" type="button" title="Chọn dòng tương ứng trên sheet">📍 Xem trên sheet</button>
  </div>
  <div class="modebar" id="mbar">
    <div class="seg"><button id="mNew" type="button" class="on">＋ Thêm mới</button><button id="mEdit" type="button">✎ Sửa</button></div>
    <select id="pick" hidden></select>
  </div>
  <div class="card"><div class="sum" id="sum"></div></div>
  <div class="tabs" id="tabs"></div>
  <form id="frm" onsubmit="return false"></form>
</div>
<div id="msg"></div>
<div class="foot">
  <div class="info"><b id="fTitle"></b><small id="fSub"></small></div>
  <button class="btn gh" id="clear" type="button">↺ Làm mới</button>
  <button class="btn pri" id="save" type="button">💾 Lưu</button>
</div>
<script>
const TABLES = {tbl_DuAn:"🏢 Dự án", tbl_HopDong:"📑 Hợp đồng", tbl_HDThanhVien:"👥 Thành viên liên danh", tbl_PhuLuc:"📎 Phụ lục",
  tbl_BaoLanh:"🛡️ Bảo lãnh", tbl_NghiemThu:"✅ Nghiệm thu", tbl_ThanhToan:"💳 Thanh toán", tbl_ChiNgoaiHD:"🧾 Chi ngoài HĐ",
  tbl_QTHopDong:"📘 Quyết toán HĐ", tbl_GoiThau:"📦 Gói thầu", tbl_NhaThau:"👷 Nhà thầu", tbl_TaiKhoanNT:"🏦 TK nhà thầu",
  tbl_TMDT:"💰 QĐ TMĐT", tbl_TMDT_CT:"💵 TMĐT chi tiết", tbl_DuToan:"📐 Dự toán", tbl_DuToan_CT:"📏 Dự toán chi tiết",
  tbl_CoCauVon:"🏛️ Nguồn vốn", tbl_KeHoachVon:"📅 Kế hoạch vốn", tbl_ThamSo:"⚙️ Tham số", tbl_CongTy:"🏛️ Chủ đầu tư"};

  { t: "🏢 Dự án", s: [["tbl_DuAn", "Thông tin"], ["tbl_TMDT", "QĐ TMĐT"], ["tbl_TMDT_CT", "TMĐT chi tiết"]] },
  { t: "📐 Dự toán", s: [["tbl_DuToan", "Thông tin"], ["tbl_DuToan_CT", "Dự toán chi tiết"]] },

  { t: "💳 Thanh toán", s: [["tbl_NghiemThu", "Nghiệm thu"], ["tbl_ThanhToan", "Thanh toán"], ["tbl_QTHopDong", "Quyết toán HĐ"]] },

};
const LAN = { tbl_TMDT: { lan: "Lần điều chỉnh", loai: "Loại phê duyệt", da: "Mã dự án", show: /sơ bộ|điều chỉnh/i } };
const LAYOUT = {
  tbl_CongTy: [
    { ic: "🏛️", t: "Thông tin công ty", c: "blue", f: ["Mã công ty", "Tên công ty", "Tên viết tắt", "Mã số thuế", "Địa chỉ trụ sở", "Trạng thái"] },
    { ic: "ƒx", t: "Tự tính (chỉ xem)", c: "violet", f: ["Số dự án"], note: "Số dự án đếm từ sheet DM_DUAN theo Mã CĐT." }
  ],
  tbl_DuAn: [
    { ic: "🏢", t: "Thông tin chung", c: "blue", f: ["Mã dự án", "Tên dự án", "Mã CĐT", "Loại hình dự án", "Nhóm dự án", "Cấp công trình"] },
    { ic: "📍", t: "Địa điểm & quy mô", c: "green", f: ["Tỉnh/Thành", "Địa điểm (xã/phường)", "Diện tích đất (m²)", "Tổng DT sàn XD (m²)", "Quy mô / Công suất"] },

    { ic: "📝", t: "Thông tin chung", c: "green", f: ["Loại phê duyệt", "Lần điều chỉnh", "Số quyết định", "Nội dung / Lý do"] },
    { ic: "📅", t: "Thời gian", c: "orange", f: ["Ngày quyết định"] },
    { ic: "ƒx", t: "Tự tính (chỉ xem)", c: "violet", f: ["Mã QĐ TMĐT", "Mã CĐT", "Giá trị trước thuế (VNĐ)", "Thuế GTGT (VNĐ)", "Giá trị sau thuế (VNĐ)", "Tăng/giảm so lần trước (VNĐ)", "Hiệu lực", "Kiểm tra"], note: "Giá trị tự tổng hợp từ sheet TMDT_CT theo Mã QĐ TMĐT – form giữ nguyên công thức, cập nhật kết quả sau khi Lưu." }

};
const SUMMARY = {

  tbl_HopDong: ["Mã hợp đồng", "Tên nhà thầu", "Trạng thái HĐ", "Giá trị pháp lý sau thuế (VNĐ)"],

let META = null, MODE = "new", CUR = "tbl_DuAn", RET = null;

  const ro = (id, lb) => '<div><label for="' + id + '">' + lb + ' <span class="fx">ƒx</span></label><input id="' + id + '" readonly tabindex="-1" class="calc" placeholder="Tự điền theo QĐ TMĐT"></div>';
  $("frm").innerHTML = secHtml(S[0], 0,
      '<div class="full"><label for="ctDA">Tên dự án <span class="req">*</span></label><select id="ctDA"></select><div class="hint" id="ctDAh"></div></div>' +
      '<div><label for="ctLoai">Loại phê duyệt <span class="req">*</span></label><select id="ctLoai" data-empty="Chọn Tên dự án trước"></select></div>' +
      '<div id="ctLanW"><label for="ctLan">Lần điều chỉnh <span class="req">*</span></label><select id="ctLan" data-empty="Chọn Loại phê duyệt trước"></select></div>' +
      ro("ctSo", "Số quyết định") + ro("ctNgay", "Ngày quyết định") + ro("ctMa", "Mã QĐ TMĐT") + ro("ctHL", "Hiệu lực")) +
    secHtml(S[1], 1, '<div class="full" id="ctGrid"></div>') +
    secHtml(S[2], 2, '<div><label for="user">Người nhập <span class="req">*</span></label><input id="user" placeholder="Tên người nhập"></div><div></div>');
  $("user").value = localStorage.getItem("nguoiNhap") || ""; $("user").oninput = () => { avatar(); ctSum(); }; avatar();
  document.querySelectorAll(".tab").forEach((t) => { Object(t).onclick = () => { $(Object(t).dataset.s).scrollIntoView({ behavior: "smooth", block: "start" }); setTab(Object(t).dataset.s); }; });
  const iM = ixOf(CT.da, "Mã dự án"), iT = ixOf(CT.da, "Tên dự án");
  $("ctDA").innerHTML = '<option value="">— Chọn —</option>' + CT.da.R.filter((r) => r[iM] !== "").map((r) => '<option value="' + esc(r[iM]) + '">' + esc(r[iT]) + "</option>").join("");
  $("ctDA").onchange = () => { $("ctLoai").value = ""; $("ctLan").value = ""; ctOpts(); };
  $("ctLoai").onchange = () => { $("ctLan").value = ""; ctOpts(); };
  $("ctLan").onchange = () => ctOpts();
  ["ctDA", "ctLoai", "ctLan"].forEach((id) => cbWrap($(id)));
  setTab("s1"); stickTabs(); ctOpts();
}
function ctOpts() {
  const Q = CT.qd, iD = ixOf(Q, "Mã dự án"), iLo = ixOf(Q, "Loại phê duyệt"), iLa = ixOf(Q, "Lần điều chỉnh"), da = $("ctDA").value;
  const rows = Q.R.filter((r) => da && String(r[iD]) === da).sort((a, b) => Number(a[iLa]) - Number(b[iLa]));
  const loais = []; rows.forEach((r) => { const v = String(r[iLo]); if (v && loais.indexOf(v) < 0) loais.push(v); });
  const keep = (id, list, lab) => {
    const el = $(id), cur = el.value;
    el.innerHTML = '<option value="">— Chọn —</option>' + list.map((v) => '<option value="' + esc(v) + '">' + esc(lab ? lab(v) : v) + "</option>").join("");
    el.value = list.indexOf(cur) >= 0 ? cur : (list.length === 1 ? list[0] : ""); cbSync(el); return el.value;
  };
  const lo = keep("ctLoai", loais), hide = /^TMĐT phê duyệt$/i.test(lo);
  $("ctLanW").style.display = hide ? "none" : "";
  const r2 = rows.filter((r) => lo && String(r[iLo]) === lo), lans = r2.map((r) => String(r[iLa]));

  const q = lo && la !== "" ? (r2.find((r) => String(r[iLa]) === la) || null) : null;
  if (q !== CT.q) ctPick(q); else ctDraw();
}
function ctPick(q) {
  const Q = CT.qd; CT.q = q; CT.ma = q ? String(q[0]) : ""; CT.adding = 0;
  $("ctSo").value = q ? String(q[ixOf(Q, "Số quyết định")]) : ""; $("ctNgay").value = q ? dmy(q[ixOf(Q, "Ngày quyết định")]) : "";
  $("ctMa").value = CT.ma; $("ctHL").value = q ? String(q[ixOf(Q, "Hiệu lực")]) : "";
  const H = CT.ct.H, iC = H.indexOf("Mã chi phí"), iG = H.indexOf("Giá trị trước thuế (VNĐ)"), iV = H.indexOf("Thuế suất VAT");
  CT.lines = [];
  if (q) CT.ct.R.forEach((r, k) => { if (String(r[0]) !== CT.ma) return; const c = String(r[iC]), x = CT.cpm[c]; CT.lines.push({ code: c, gv: r[iG], vat: r[iV], ri: k, hdr: !!(x && !x.leaf) }); });
  ctDraw();
}
const ctLine = (c) => CT.lines.find((x) => x.code === c) || {};
function ctTree() {
  const set = Object.create(null), sum = Object.create(null);
  CT.lines.forEach((l) => { let c = l.code; while (c) { set[c] = 1; c = parentOf(c); } });
  CT.lines.forEach((l) => { if (l.hdr) return; const g = Number(l.gv) || 0, t = Math.round(g * (Number(l.vat) || 0)); let c = l.code; while (c) { const s = sum[c] || (sum[c] = { g: 0, t: 0 }); s.g += g; s.t += t; c = parentOf(c); } });
  const codes = Object.keys(set).sort(), cnt = [];
  return codes.map((c) => {
    const d = c.split(".").length, l = CT.lines.find((x) => x.code === c);
    cnt.length = d; for (let i = 0; i < d - 1; i++) if (!cnt[i]) cnt[i] = 1; cnt[d - 1] = (cnt[d - 1] || 0) + 1;
    const p = !l || l.hdr || codes.some((x) => x.indexOf(c + ".") === 0);
    return { c: c, d: d, tt: cnt.join("."), p: p, l: l, s: sum[c] || { g: 0, t: 0 } };
  });
}
function ctTot() { let g = 0, t = 0; CT.lines.forEach((l) => { if (l.hdr) return; const a = Number(l.gv) || 0; g += a; t += Math.round(a * (Number(l.vat) || 0)); }); return { g: g, t: t }; }
function ctVat(c) { const H = CT.ct.H, iC = H.indexOf("Mã chi phí"), iV = H.indexOf("Thuế suất VAT"); for (let k = CT.ct.R.length - 1; k >= 0; k--) if (String(CT.ct.R[k][iC]) === c && CT.ct.R[k][iV] !== "") return CT.ct.R[k][iV]; return ""; }
function ctPrev() {
  if (!CT.q || CT.lines.length) return null;
  const Q = CT.qd, iD = ixOf(Q, "Mã dự án"), iLa = ixOf(Q, "Lần điều chỉnh"), da = String(CT.q[iD]), lan = Number(CT.q[iLa]);
  const p = Q.R.filter((r) => String(r[iD]) === da && Number(r[iLa]) < lan).sort((a, b) => Number(b[iLa]) - Number(a[iLa]))[0];
  if (!p) return null; const ma = String(p[0]);
  const H = CT.ct.H, iC = H.indexOf("Mã chi phí"), iG = H.indexOf("Giá trị trước thuế (VNĐ)"), iV = H.indexOf("Thuế suất VAT");
  const ls = CT.ct.R.filter((r) => String(r[0]) === ma).map((r) => { const c = String(r[iC]), x = CT.cpm[c]; return { code: c, gv: r[iG], vat: r[iV], ri: null, hdr: !!(x && !x.leaf) }; });
  return ls.length ? { ma: ma, ls: ls } : null;
}
function ctDraw() {
  cbClose(); const g = $("ctGrid"); if (!g.id) return;
  const lk = !CT.q, lm = $("lk_s2");
  lm.textContent = lk ? "🔒 Chọn Tên dự án, Loại phê duyệt" + ($("ctLanW").style.display === "none" ? "" : " và Lần điều chỉnh") + " để mở" : ""; lm.style.display = lk ? "block" : "none";
  if (lk) { g.innerHTML = ""; ctSum(); return; }
  const rows = ctTree(), used = Object.create(null); CT.lines.forEach((l) => { used[l.code] = 1; });
  const vopt = (v) => '<option value="">— VAT —</option>' + CT.vat.map((x) => '<option value="' + x + '"' + (v !== "" && v != null && Number(v) === Number(x) ? " selected" : "") + ">" + (+(Number(x) * 100).toFixed(2)) + "%</option>").join("");
  const nm = (r) => '<div class="nm" style="padding-left:' + (r.d - 1) * 14 + 'px"><span class="t">' + esc(r.c + "  " + (CT.cpm[r.c] ? CT.cpm[r.c].n : "⚠ Mã không có trong DM_MACHIPHI")) + "</span>" + (r.l ? '<button type="button" class="del" data-del="' + esc(r.c) + '" title="Xoá dòng">✕</button>' : "") + "</div>";
  let h = '<table class="ctg"><colgroup><col class="tt"><col><col class="gv"><col class="vt"></colgroup><thead><tr><th>TT</th><th>Loại chi phí</th><th style="text-align:right">Giá trị trước thuế</th><th style="text-align:right">Thuế VAT</th></tr></thead><tbody>';
  h += rows.map((r) => r.p
    ? '<tr class="par' + (r.d === 1 ? " lv1" : "") + '"><td class="tt">' + r.tt + "</td><td>" + nm(r) + '</td><td><span class="ro" data-sg="' + esc(r.c) + '">' + (fmt(r.s.g) || "0") + '</span></td><td><span class="ro" data-st="' + esc(r.c) + '">' + (fmt(r.s.t) || "0") + "</span></td></tr>"
    : '<tr><td class="tt">' + r.tt + "</td><td>" + nm(r) + '</td><td><input class="num ctgv" data-c="' + esc(r.c) + '" inputmode="decimal" placeholder="0" value="' + esc(fmt(r.l.gv)) + '"></td><td><select class="ctvat" data-c="' + esc(r.c) + '">' + vopt(r.l.vat) + '</select><div class="amt" data-st="' + esc(r.c) + '">' + (fmt(r.s.t) || "0") + "</div></td></tr>").join("");
  const nopt = '<option value="">— Gõ để tìm khoản mục chi phí —</option>' + CT.codes.filter((c) => !used[c]).map((c) => { const x = CT.cpm[c], d = c.split(".").length; return '<option value="' + esc(c) + '">' + "\u00a0".repeat((d - 1) * 4) + esc(c + "  " + x.n) + (x.leaf ? "" : "  ▸") + "</option>"; }).join("");
  for (let i = 0; i < CT.adding; i++) h += '<tr class="new"><td class="tt">＋</td><td colspan="3"><select class="ctnew">' + nopt + "</select></td></tr>";
  if (!rows.length && !CT.adding) h += '<tr><td></td><td colspan="3" class="hint">Chưa có khoản mục – bấm ＋ Thêm khoản mục.</td></tr>';
  const pv = ctPrev(), T = ctTot();
  h += '</tbody><tfoot><tr><td></td><td colspan="3"><button type="button" class="addbtn" id="ctAddB">＋ Thêm khoản mục</button>' + (pv ? '<button type="button" class="addbtn" id="ctCopy">⧉ Sao chép từ ' + esc(pv.ma) + "</button>" : "") + "</td></tr>";
  h += '<tr class="tot"><td></td><td>TỔNG CỘNG<div style="font-weight:400;font-size:11px">Sau thuế: <span id="ctTs">' + (fmt(T.g + T.t) || "0") + '</span> đ</div></td><td><span class="ro" id="ctTg">' + (fmt(T.g) || "0") + '</span></td><td><span class="ro" id="ctTt">' + (fmt(T.t) || "0") + "</span></td></tr></tfoot></table>";
  g.innerHTML = h;
  g.querySelectorAll(".ctgv").forEach((e) => {
    const el = Object(e);
    el.addEventListener("input", () => { ctLine(el.dataset.c).gv = parseNum(el.value); el.classList.remove("err"); ctUpd(); });
    el.addEventListener("blur", () => { const v = parseNum(el.value); el.value = v === "" ? "" : fmt(v); });
    el.addEventListener("keydown", (ev) => { if (ev.key === "Enter") { ev.preventDefault(); el.blur(); } });
  });
  g.querySelectorAll(".ctvat").forEach((e) => { const el = Object(e); cbWrap(el); el.addEventListener("change", () => { ctLine(el.dataset.c).vat = el.value === "" ? "" : Number(el.value); ctUpd(); }); });
  g.querySelectorAll(".del").forEach((e) => { Object(e).onclick = () => { const c = Object(e).dataset.del; CT.lines = CT.lines.filter((x) => x.code !== c); ctDraw(); }; });
  g.querySelectorAll(".ctnew").forEach((e) => { const el = Object(e); cbWrap(el); el.addEventListener("change", () => { if (el.value) ctAdd(el.value); }); });
  $("ctAddB").onclick = () => { CT.adding++; ctDraw(); const n = g.querySelectorAll(".ctnew"), s = Object(n[n.length - 1]); if (s && s.parentNode) { const b = s.parentNode.querySelector(".cb-btn"); if (b) cbOpen(s, b); } };
  if (pv) $("ctCopy").onclick = () => { CT.lines = pv.ls; ctDraw(); msg("Đã sao chép " + pv.ls.length + " dòng từ " + pv.ma + " – điều chỉnh rồi bấm Lưu", false); };
  ctSum();
}
function ctAdd(c) {
  CT.adding = Math.max(0, CT.adding - 1);
  if (!CT.lines.some((x) => x.code === c)) { const x = CT.cpm[c]; CT.lines.push({ code: c, gv: "", vat: x && x.leaf ? ctVat(c) : "", ri: null, hdr: !!(x && !x.leaf) }); }
  ctDraw();
  const inp = Object(document.querySelector('.ctgv[data-c="' + c + '"]')); if (inp.focus) inp.focus();
}
function ctUpd() {
  ctTree().forEach((r) => { const a = Object(document.querySelector('[data-sg="' + r.c + '"]')), b = Object(document.querySelector('[data-st="' + r.c + '"]')); if (a.tagName) a.textContent = fmt(r.s.g) || "0"; if (b.tagName) b.textContent = fmt(r.s.t) || "0"; });
  const T = ctTot(); $("ctTg").textContent = fmt(T.g) || "0"; $("ctTt").textContent = fmt(T.t) || "0"; $("ctTs").textContent = fmt(T.g + T.t) || "0";
  ctSum();
}
function ctSum() {
  const T = ctTot(), n = CT.lines.filter((l) => !l.hdr).length, da = $("ctDA"), o = da.options ? da.options[da.selectedIndex] : null, nm = o && da.value ? o.text : "";
  const it = [["Mã QĐ TMĐT", CT.ma || "—"], ["Số khoản mục chi tiết", n ? String(n) : "—"], ["Trước thuế", T.g ? fmt(T.g) + " đ" : "—"], ["Thuế VAT", T.t ? fmt(T.t) + " đ" : "—"], ["Sau thuế", T.g + T.t ? fmt(T.g + T.t) + " đ" : "—"]];
  $("sum").innerHTML = it.map((x) => '<div><div class="k">' + x[0] + '</div><div class="v" title="' + esc(x[1]) + '">' + esc(x[1]) + "</div></div>").join("");
  $("crumb").innerHTML = "TMĐT chi tiết / <b>" + esc(CT.ma || "Chọn QĐ TMĐT") + "</b>";
  $("fTitle").textContent = CT.ma ? CT.ma + " · " + nm : "Chọn QĐ TMĐT";
  $("fSub").textContent = n + " khoản mục chi tiết";
  const ed = CT.lines.some((l) => l.ri != null); $("badge").textContent = ed ? "Đang sửa" : "Thêm mới"; $("badge").className = "badge " + (ed ? "b-edit" : "b-new");
  const ok2 = n > 0 && CT.lines.every((l) => l.hdr || (l.gv !== "" && l.gv != null && l.vat !== "" && l.vat != null));
  const st = [!!CT.q, ok2, !!String($("user").value || "").trim()];
  $("c_s1").textContent = CT.q ? "Đã chọn QĐ" : "Chưa chọn"; $("c_s2").textContent = n + " dòng"; $("c_s3").textContent = "";
  st.forEach((ok, k) => { const tab = Object(document.querySelector('.tab[data-s="s' + (k + 1) + '"]')); if (tab.classList) { tab.classList.toggle("done", ok); tab.querySelector(".n").textContent = ok ? "✓" : String(k + 1); } });
}
function ctReset() { ["ctDA", "ctLoai", "ctLan"].forEach((id) => { $(id).value = ""; }); CT.q = undefined; ctOpts(); msg("Đã làm mới", false); }
async function saveCT() {
  const user = String($("user").value || "").trim();
  if (!user) { $("user").classList.add("err"); $("user").focus(); return msg("Nhập tên người nhập (mục Lưu vết)", true); }
  localStorage.setItem("nguoiNhap", user); $("user").classList.remove("err");
  if (!CT.q) return msg("Chọn Tên dự án, Loại phê duyệt (và Lần điều chỉnh) trước", true);
  const lines = CT.lines.filter((l) => !l.hdr);
  const lone = CT.lines.find((l) => l.hdr && !CT.lines.some((x) => x !== l && x.code.indexOf(l.code + ".") === 0));
  if (lone) return msg("Khoản mục " + lone.code + " là mã tổng hợp – thêm khoản mục con hoặc xoá dòng", true);
  const mark = (c) => { const i = Object(document.querySelector('.ctgv[data-c="' + c + '"]')); if (i.classList) { i.classList.add("err"); i.focus(); } };
  const unk = lines.find((l) => !CT.cpm[l.code]); if (unk) return msg("Mã " + unk.code + " không có trong DM_MACHIPHI – xoá dòng này", true);
  const bad = lines.find((l) => l.gv === "" || l.gv == null || isNaN(Number(l.gv))); if (bad) { mark(bad.code); return msg("Nhập giá trị trước thuế cho " + bad.code, true); }
  const nv = lines.find((l) => l.vat === "" || l.vat == null); if (nv) return msg("Chọn thuế suất VAT cho " + nv.code, true);
  let nA = 0, nU = 0, nD = 0;
  await Excel.run(async (ctx) => {
    const t = ctx.workbook.tables.getItem(CT_TN), b = t.getDataBodyRange(); b.load("values"); await ctx.sync();
    const R = b.values, H = CT.ct.H, ix = (n) => H.indexOf(n);
    const iC = ix("Mã chi phí"), iG = ix("Giá trị trước thuế (VNĐ)"), iV = ix("Thuế suất VAT"), iNT = ix("Ngày tạo"), iUT = ix("Người tạo"), iNS = ix("Ngày sửa"), iUS = ix("Người sửa");
    const cur = Object.create(null); R.forEach((r, k) => { if (String(r[0]) === CT.ma) cur[String(r[iC])] = k; });
    const mk = (l, old) => CT.f0.map((f, i) => {
      if (String(f).charAt(0) === "=") return f; if (i === 0) return CT.ma; if (i === iC) return l.code;
      if (i === iG) return Number(l.gv); if (i === iV) return Number(l.vat);
      if (i === iNT) return old ? old[i] : today(); if (i === iUT) return old ? old[i] : user;
      if (i === iNS) return old ? today() : ""; if (i === iUS) return old ? user : "";
      return old ? old[i] : "";
    });
    const add = [], keep = Object.create(null);
    lines.forEach((l) => { keep[l.code] = 1; const k = cur[l.code]; if (k == null) { add.push(mk(l, null)); nA++; } else if (Number(R[k][iG]) !== Number(l.gv) || Number(R[k][iV]) !== Number(l.vat)) { b.getRow(k).formulas = [mk(l, R[k])]; nU++; } });
    await ctx.sync();
    const del = Object.keys(cur).filter((c) => !keep[c]).map((c) => cur[c]).sort((x, y) => y - x);
    del.forEach((k) => t.rows.getItemAt(k).delete()); nD = del.length; await ctx.sync();
    if (add.length) { t.rows.add(null, add); await ctx.sync(); }
    if (nA + nU + nD) { t.sort.apply([{ key: 0, ascending: true }, { key: iC, ascending: true }]); await ctx.sync(); }
  });
  const d = await ctLoad(); CT.da = d.da; CT.qd = d.qd; CT.ct = d.ct; META.rows = d.ct.R;
  const q = CT.qd.R.find((r) => String(r[0]) === CT.ma) || null; CT.q = undefined; ctPick(q);
  const s = q ? q[ixOf(CT.qd, "Giá trị sau thuế (VNĐ)")] : 0;
  msg(nA + nU + nD ? "✅ Đã lưu " + CT.ma + ": thêm " + nA + ", sửa " + nU + ", xoá " + nD + " dòng · TMĐT sau thuế " + fmt(s) + " đ" : "Không có thay đổi để lưu", false);
}
