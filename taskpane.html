eY(-1px)}.tab.done .n{animation:popN .35s ease}.cb-pop{animation:dropIn .16s ease-out}#msg{animation:slideUp .22s ease-out}.prog i{transition:width .5s cubic-bezier(.2,.8,.2,1)}.calc.fx-upd{animation:fxFlash .9s ease-out}@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</div>

); return "Giá thực = Có: nhập Tỷ lệ phí"; } const fn = F("Tên gói thầu"), fa = F("Mã dự án"); if (MODE === "new" && fn && fa && META.rows.some((r) => r[0] !== "" && String(r[fa.i]) === val(fa) && String(r[fn.i]).trim().toLowerCase() === val(fn).toLowerCase())) { E(fn).classList.add("err"); return "Dự án đã có gói thầu cùng tên – đổi tên hoặc dùng Sửa"; } const R = GT.rows.filter((r) => r.dt || r.cp || r.v !== ""); if (!R.length) return "Thêm ít nhất 1 dòng ở mục Phạm vi dự toán"; for (let i = 0; i < R.length; i++) { const r = R[i]; if (!r.cp) return "Phạm vi dự toán dòng " + (i + 1) + ": chọn hạng mục chi phí"; if (!(Number(r.v) > 0)) return "Phạm vi dự toán dòng " + (i + 1) + ": nhập giá trị phân bổ > 0"; if (R.some((x, j) => j !== i && x.dt === r.dt && x.cp === r.cp)) return "Phạm vi dự toán: trùng hạng mục " + r.cp; if (r.dt) { const con = gtLine(r.dt, r.cp) - gtOther(r.dt, r.cp); if (Number(r.v) > con) return "Phạm vi dự toán dòng " + (i + 1) + ": vượt dự toán còn lại (" + (fmt(con) || "0") + " đ)"; } } const gw = F("Giá trúng thầu trước thuế (VNĐ)"), tot = R.reduce((a, r) => a + Number(r.v), 0); if (gw && getVal(gw) !== "" && Number(getVal(gw)) > tot) { E(gw).classList.add("err"); return "Giá trúng thầu lớn hơn Giá gói thầu (" + fmt(tot) + " đ)"; } GT.rows = R; return ""; } async function gtSave(ctx, key, user) { const t = ctx.workbook.tables.getItem("tbl_GoiThau_CT"), b = t.getDataBodyRange(); b.load("values,formulas,rowCount"); await ctx.sync(); const H = GT.H, iK = H.indexOf("Mã gói thầu"), iD = H.indexOf("Mã dự toán"), iC = H.indexOf("Mã chi phí"), tf = b.formulas[0], prev = Object.create(null); const old = []; b.values.forEach((r, k) => { if (String(r[iK]) === String(key)) { old.push(k); prev[String(r[iD]) + "|" + String(r[iC])] = r; } }); const out = GT.rows.map((r, i) => H.map((h, j) => { const f = String(tf[j]); if (f.charAt(0) === "=") return f; const p = prev[r.dt + "|" + r.cp]; if (h === "Mã dòng GT") return key + "-" + String(i + 1).padStart(2, "0"); if (h === "Mã gói thầu") return key; if (h === "Mã dự toán") return r.dt; if (h === "Mã chi phí") return r.cp; if (h === "Giá trị phân bổ trước thuế (VNĐ)") return Number(r.v); if (h === "Ngày tạo") return p ? p[j] : today(); if (h === "Người tạo") return p ? p[j] : user; if (h === "Ngày sửa") return p ? today() : ""; if (h === "Người sửa") return p ? user : ""; if (h === "Ghi chú") return p ? p[j] : ""; return ""; })); let n = b.rowCount; for (const k of old.reverse()) { await delRow(ctx, t, k, n); n--; } const b2 = t.getDataBodyRange(); b2.load("values,rowCount"); await ctx.sync(); let start = b2.rowCount; if (b2.rowCount === 1 && String(b2.values[0][0]) === "") { start = 0; b2.getRow(0).formulas = [out[0]]; if (out.length > 1) t.rows.add(null, out.slice(1)); } else t.rows.add(null, out); await ctx.sync(); const nb = t.getDataBodyRange(); [iD, iC].forEach((j) => { const rg = nb.getCell(start, j).getResizedRange(out.length - 1, 0); rg.numberFormat = out.map(() => ["@"]); rg.values = out.map((r) => [r[j]]); }); await ctx.sync(); t.sort.apply([{ key: 0, ascending: true }]); await ctx.sync(); const b3 = t.getDataBodyRange(); b3.load("values"); await ctx.sync(); GT.ct = gtRows(H, b3.values); }

const DEL_SKIP = ["tbl_HDHienHanh", "tbl_TVHienHanh", "tbl_DataDictionary", "tbl_DanhSachBang", "tbl_Checklist", "tbl_NhomThamSo"];
const DEL_ALIAS = { tbl_CongTy: ["Mã CĐT"], tbl_NhaThau: ["Mã nhà thầu trúng thầu", "Nhà thầu nhận tiền", "Mã đơn vị trúng thầu", "Mã NT đứng đầu", "Mã các thành viên khác"], tbl_LienDanh: ["Mã đơn vị trúng thầu"], tbl_TaiKhoanNT: ["TK thụ hưởng"], tbl_MaChiPhi: ["Mã cha"], tbl_NghiemThu: ["Danh sách biên bản"] };

const DEL_NOREF = ["tbl_ThamSo"];
let DELARM = 0;
function delTarget() {
  if (!META) return null;

function delDisarm() { DELARM = 0; clearTimeout(delDisarm.h); const b = $("delB"); if (b.id) { b.classList.remove("arm"); b.textContent = "🗑 Xoá"; } }
function delVis() { const b = $("delB"); if (!b.id) return; const t = delTarget(); b.hidden = !t; if (!t && DELARM) delDisarm(); }
async function delClick() {
  const t = delTarget(); if (!t) return msg("Chọn bản ghi cần xoá (chế độ Sửa)", true);

    const tb = ctx.workbook.tables.getItem(t.tn), body = tb.getDataBodyRange(); body.load("values,rowCount"); await ctx.sync();

async function delRow(ctx, tb, k, n) {
  if (n > 1) { tb.rows.getItemAt(k).delete(); await ctx.sync(); return; }
  const r = tb.getDataBodyRange().getRow(0); r.load("formulas"); await ctx.sync();
  r.formulas = [r.formulas[0].map((f) => String(f).charAt(0) === "=" ? f : "")]; await ctx.sync();
}
async function delWhere(ctx, tn, col, key) {
  try {
    const tb = ctx.workbook.tables.getItem(tn), h = tb.getHeaderRowRange(), b = tb.getDataBodyRange(); h.load("values"); b.load("values,rowCount"); await ctx.sync();
    const i = h.values[0].indexOf(col); if (i < 0) return 0;
    const ks = []; b.values.forEach((r, k) => { if (String(r[i]) === String(key)) ks.push(k); });
    let n = b.rowCount; ks.sort((a, c) => c - a);
    for (const k of ks) { await delRow(ctx, tb, k, n); n--; }
    return ks.length;
  } catch (e) { return 0; }
}
async function delViews(ctx) {
  try {
    const wb = ctx.workbook, hd = wb.tables.getItem("tbl_HopDong").getDataBodyRange(), dv = wb.names.getItem("lst_DonViTC").getRange();

async function delRefs(t) {
  if (DEL_NOREF.indexOf(t.tn) >= 0) return [];

    const ts = ctx.workbook.tables; ts.load("items/name"); await ctx.sync();

async function delCT(t) {
  let n = 0;
  await Excel.run(async (ctx) => { n = await delWhere(ctx, CT_TN, CT.ct.H[0], t.key); });
  const d = await ctLoad(); CT.da = d.da; CT.qd = d.qd; CT.ct = d.ct; META.rows = d.ct.R;
